# =============================================================================
# worker-kmp — Single version source of truth
# Bump this ONE value to release all modules together.
# =============================================================================
worker.version=4.0.8

# Maven Central Publishing (vanniktech 0.36.0 reads these from gradle.properties)
SONATYPE_HOST=CENTRAL_PORTAL
SONATYPE_AUTOMATIC_RELEASE=true

# Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options="-Xmx4096M"
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Dokka
org.jetbrains.dokka.experimental.gradle.pluginMode=V2EnabledWithHelpers

# Kotlin
# Kotlin/Native (iOS framework linking) compiles in its OWN JVM — `org.gradle.jvmargs` does NOT
# reach it, and no default was set here. Under Kotlin 2.4.20 the release-mode devirtualization
# pass on the Compose sample exhausted the default heap:
#   e: Compilation failed: GC overhead limit exceeded
#     at ...backend.konan.optimizations.DevirtualizationAnalysis...ConstraintGraphBuilder
# failing :samples:cmp-worker-sample-compose-store:link{Debug,Release}FrameworkIosArm64.
kotlin.native.jvmArgs=-Xmx8g
kotlin.code.style=official
kotlin.incremental=true
kotlin.mpp.enableCInteropCommonization=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
