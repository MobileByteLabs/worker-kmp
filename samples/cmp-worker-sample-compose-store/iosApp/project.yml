# xcodegen spec — generates iosApp.xcodeproj on demand (see iosApp/README.md).
# Hand-authored mirror of what `worker-kmp-app-plugin`'s `ios-project.yml.template`
# would generate.
name: iosApp
options:
  bundleIdPrefix: io.github.mobilebytelabs.worker.sample.composestore
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_LANGUAGE: en
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ARCHS: arm64
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    ONLY_ACTIVE_ARCH: "YES"
    FRAMEWORK_SEARCH_PATHS:
      - $(SRCROOT)/../build/bin/iosSimulatorArm64/debugFramework
      - $(SRCROOT)/../build/bin/iosArm64/debugFramework

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: "worker-kmp Store Demo"
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
    dependencies:
      - framework: ../build/bin/iosSimulatorArm64/debugFramework/ComposeApp.framework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mobilebytelabs.worker.sample.composestore
        TARGETED_DEVICE_FAMILY: "1,2"
