# xcodegen spec — generates iosApp/iosApp.xcodeproj
#
# Authored 2026-05-28 as part of:
#   plan-layer/project-plans/mbs/worker-kmp/active/worker-kmp-cmp-launchers/
#     03-sample-restructure.md
#
# Why xcodegen instead of a committed .xcodeproj?
# Xcode's project.pbxproj is merge-hostile (UUID-keyed, line-order-sensitive).
# xcodegen lets us declare project shape in YAML and regenerate the .xcodeproj
# deterministically, so iOS work isn't single-threaded by Xcode merge conflicts.
#
# To materialize the project:
#   brew install xcodegen
#   cd samples/cmp-worker-sample-compose-store/iosApp
#   xcodegen generate
#
# CI's `sample-ios` job in .github/workflows/pr-check.yml runs `xcodegen generate`
# before `xcodebuild` so the .xcodeproj never needs to live in git.

name: iosApp
options:
  bundleIdPrefix: io.github.mobilebytelabs.worker.sample.composestore
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_LANGUAGE: en
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Restrict to arm64 — the Kotlin/Native iOS Simulator framework is built
    # only for iosSimulatorArm64 (no iosX64 target declared). Linking against
    # the arm64 framework from an x86_64 slice fails with "found architecture
    # arm64, required architecture x86_64". Apple Silicon CI runners + modern
    # iOS Simulators are all arm64, so this is the right floor.
    ARCHS: arm64
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    ONLY_ACTIVE_ARCH: "YES"
    # Path to the Kotlin/Native ComposeApp framework produced by:
    #   ./gradlew :samples:cmp-worker-sample-compose-store:linkDebugFrameworkIosSimulatorArm64
    #   ./gradlew :samples:cmp-worker-sample-compose-store:linkDebugFrameworkIosArm64
    FRAMEWORK_SEARCH_PATHS:
      - $(SRCROOT)/../build/bin/iosSimulatorArm64/debugFramework
      - $(SRCROOT)/../build/bin/iosArm64/debugFramework

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: "worker-kmp Store Demo"
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
    dependencies:
      - framework: ComposeApp.framework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mobilebytelabs.worker.sample.composestore
        TARGETED_DEVICE_FAMILY: "1,2"
