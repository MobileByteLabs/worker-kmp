# PR Check Workflow — fast gate on pull requests
# Runs quality + JVM tests only (iOS/Linux skipped for speed).
# Full build runs on push to main/development via gradle.yml.

name: PR Check

on:
  pull_request:
    branches: [ "main", "development" ]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-check:
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/ci-kmp-library.yml@v1.6.1
    with:
      module-pattern: 'cmp-'
      java-version: '21'
      java-distribution: 'zulu'
      run-quality: true
      run-ios-tests: false
      run-linux-tests: false

  # worker-kmp-cmp-launchers-01: assert cmp-worker-compose publishes BCV
  # snapshots covering iosArm64 + iosSimulatorArm64 (+ js + wasmJs).
  ios-bcv-check:
    name: cmp-worker-compose iOS BCV snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert iOS BCV snapshot present + lists iOS targets
        run: bash scripts/check-ios-artifact.sh

  # worker-kmp-cmp-launchers-03: build the cmp-worker-sample-compose-store
  # sample for the Web (wasmJs browser) target.
  sample-wasmjs:
    name: cmp-worker-sample-compose-store — wasmJs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build wasmJs distribution
        run: ./gradlew :samples:cmp-worker-sample-compose-store:wasmJsBrowserDistribution

  # worker-kmp-cmp-launchers-03 (Part A): the iOS framework + xcodegen project
  # — these BOTH work on any Xcode version (16+ or 26+). This is the always-on
  # iOS CI gate: validates the Kotlin/Native iosMain compiles, links into a
  # Static Framework with the right exports, and that xcodegen can materialize
  # a valid iosApp.xcodeproj from project.yml. Required check.
  sample-ios-framework:
    name: cmp-worker-sample-compose-store — iOS framework + xcodegen
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Show Xcode version (debug)
        run: xcodebuild -version
      - name: Build iOS framework binaries (linkDebugFrameworkIosSimulatorArm64)
        run: ./gradlew :samples:cmp-worker-sample-compose-store:linkDebugFrameworkIosSimulatorArm64
      - name: Generate iosApp.xcodeproj from xcodegen project.yml
        working-directory: samples/cmp-worker-sample-compose-store/iosApp
        run: xcodegen generate
      - name: Assert .xcodeproj structure
        run: |
          test -f samples/cmp-worker-sample-compose-store/iosApp/iosApp.xcodeproj/project.pbxproj
          echo "OK: iosApp.xcodeproj generated and structurally valid"

  # worker-kmp-cmp-launchers-03 (Part B): the xcodebuild iosApp linker step.
  # Compose Multiplatform 1.11.0's iOS framework auto-links iOS-18-only private
  # frameworks (UIUtilities, SwiftUICore) which require Xcode 26.x at link time.
  # GitHub Actions is migrating `macos-latest` from macOS 15 (Xcode 16.x) to
  # macOS 26 (Xcode 26.x) between June 15 → July 15, 2026:
  #   https://github.com/actions/runner-images
  #
  # This job auto-detects the runner's Xcode major version and:
  #   - Xcode major >= 26 → run xcodebuild (will pass; HARD gate going forward)
  #   - Xcode major <  26 → skip with informative log (returns success, doesn't
  #     block CI; matches the de-facto state until macos-latest migrates)
  #
  # Local validation via `scripts/ci-local.sh --all` is the source of truth
  # for this gate today (requires local Xcode 26.x — script enforces).
  # Post July 15, 2026 the runner gets Xcode 26 automatically + this gate
  # turns into a real iOS regression catch with NO workflow change required.
  sample-ios-xcodebuild:
    name: cmp-worker-sample-compose-store — iOS xcodebuild (Xcode 26+)
    needs: sample-ios-framework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Detect Xcode major version
        id: xcode
        run: |
          XCODE_VERSION="$(xcodebuild -version | head -1 | awk '{print $2}')"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          echo "version=$XCODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$XCODE_MAJOR"     >> "$GITHUB_OUTPUT"
          echo "::notice title=Xcode version::Detected Xcode $XCODE_VERSION (major=$XCODE_MAJOR)"
      - name: Skip xcodebuild — Xcode < 26 cannot link Compose Multiplatform iOS
        if: ${{ steps.xcode.outputs.major < '26' }}
        run: |
          cat <<EOF
          ━━━ xcodebuild SKIPPED — Xcode ${{ steps.xcode.outputs.version }} is too old ━━━

          Compose Multiplatform 1.11.0's iOS framework auto-links iOS-18 private
          frameworks (UIUtilities, SwiftUICore) that don't exist in the SDK
          shipped with Xcode 16.x.

          This gate becomes a hard CI check automatically once macos-latest
          migrates to macOS 26 + Xcode 26.x (per GitHub announcement, between
          2026-06-15 → 2026-07-15: https://github.com/actions/runner-images).

          Until then, local validation via Xcode 26.x is authoritative:
            ./scripts/ci-local.sh --all

          (Part A — sample-ios-framework — IS hard-gating this PR and PASSED
          above, so the iOS side of the launcher epic is still validated.)
          EOF
      - name: Build iOS framework binaries
        if: ${{ steps.xcode.outputs.major >= '26' }}
        run: ./gradlew :samples:cmp-worker-sample-compose-store:linkDebugFrameworkIosSimulatorArm64
      - name: Generate iosApp.xcodeproj
        if: ${{ steps.xcode.outputs.major >= '26' }}
        working-directory: samples/cmp-worker-sample-compose-store/iosApp
        run: xcodegen generate
      - name: xcodebuild iosApp (iOS Simulator, arm64)
        if: ${{ steps.xcode.outputs.major >= '26' }}
        run: |
          xcodebuild \
            -project samples/cmp-worker-sample-compose-store/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS= \
            build

  kmp-project-template-assemble:
    name: kmp-project-template — assemble (full KMP matrix)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble samples/kmp-project-template all KMP targets
        # samples/kmp-project-template is a separate Gradle build (own settings.gradle.kts
        # + gradlew). Invoke its own wrapper from inside the directory rather than via
        # `:samples:kmp-project-template:assemble` from the root build.
        working-directory: samples/kmp-project-template
        run: ./gradlew assemble --no-configuration-cache
