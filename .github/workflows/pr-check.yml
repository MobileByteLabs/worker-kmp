# PR Check — comprehensive gate on every pull request.
#
# Covers: quality · all platform tests · Kover 100% · wasmJs sample.
#
# Self-scaling: platform test jobs use Gradle aggregate tasks.
# Adding a new module automatically includes its tests — no CI changes needed.
#
# iOS simulator tests, iOS framework builds, and xcodebuild are intentionally
# excluded from the PR gate — they are heavy (~40min) and run on expensive
# macOS runners. Run locally via ./scripts/ci-local.sh --ios before pushing.
#
# Job map:
#   quality              fast: spotless + detekt (ubuntu)
#   tests-android        Android Robolectric tests (ubuntu) — parallel
#   tests-js             JS Node tests (ubuntu) — parallel
#   tests-wasmjs         WasmJS Node tests (ubuntu) — parallel
#   coverage             Kover 100% gate — JVM tests only (~3min), runs in parallel
#   ios-bcv-check        BCV snapshot asserts iOS targets in cmp-worker-compose (ubuntu)
#   sample-wasmjs        cmp-worker-sample-compose-store wasmJs browser build (ubuntu)

name: PR Check

on:
  pull_request:
    branches: [ "main", "development" ]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Quality gate (Spotless + Detekt) ──────────────────────────────────────
  quality:
    name: Quality (Spotless · Detekt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Spotless check
        run: ./gradlew spotlessCheck
      - name: Detekt
        run: ./gradlew detekt

  # ── Platform engine tests (ubuntu) ────────────────────────────────────────
  #
  # Split into 3 parallel jobs so each platform runs on its own runner.
  # JVM tests are already covered by the coverage job — excluded here.
  # Browser targets excluded: require Chrome, test identical code to Node variants.
  # New modules are picked up automatically — no CI changes required.
  tests-android:
    name: Platform tests — Android (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android Robolectric tests
        run: |
          ./gradlew allTests \
            -x iosSimulatorArm64Test \
            -x jsBrowserTest \
            -x wasmJsBrowserTest \
            -x jsNodeTest \
            -x wasmJsNodeTest \
            -x jvmTest \
            --continue --console=plain
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-test-results-android
          path: '**/build/reports/tests/'
          retention-days: 7

  tests-js:
    name: Platform tests — JS Node (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JS Node tests
        run: ./gradlew jsNodeTest --continue --console=plain
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-test-results-js
          path: '**/build/reports/tests/'
          retention-days: 7

  tests-wasmjs:
    name: Platform tests — WasmJS Node (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run WasmJS Node tests
        run: ./gradlew wasmJsNodeTest --continue --console=plain
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-test-results-wasmjs
          path: '**/build/reports/tests/'
          retention-days: 7

  # ── Kover 100% coverage gate (ubuntu) ─────────────────────────────────────
  #
  # Kover only instruments JVM targets — it does not run JS or WasmJS tests.
  # This job therefore only triggers JVM test tasks (~15min) and runs in
  # parallel with platform-ubuntu. Wall time = max(platform, coverage) ≈ 25min.
  coverage:
    name: Kover 100% gate (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Kover verify + reports
        run: ./gradlew koverHtmlReport koverXmlReport koverVerify --console=plain
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-html-report
          path: build/reports/kover/html/
          retention-days: 14
      - name: Surface coverage % in PR Step Summary
        if: always()
        run: |
          REPORT=build/reports/kover/report.xml
          if [ ! -f "$REPORT" ]; then
            echo "## ⚠ Coverage XML report missing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          COVERED=$(grep -m1 'type="LINE"' "$REPORT" | sed -E 's/.*covered="([0-9]+)".*/\1/')
          MISSED=$(grep -m1 'type="LINE"' "$REPORT" | sed -E 's/.*missed="([0-9]+)".*/\1/')
          TOTAL=$((COVERED + MISSED))
          if [ "$TOTAL" -eq 0 ]; then
            echo "## ⚠ No coverable lines reported" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          PCT=$((COVERED * 100 / TOTAL))
          echo "## ☂ Aggregate line coverage: ${PCT}% (${COVERED}/${TOTAL})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "HTML report uploaded as \`kover-html-report\` artifact." >> "$GITHUB_STEP_SUMMARY"

  # ── iOS BCV snapshot ───────────────────────────────────────────────────────
  ios-bcv-check:
    name: cmp-worker-compose iOS BCV snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert iOS BCV snapshot present + lists iOS targets
        run: bash scripts/check-ios-artifact.sh

  # ── Sample: wasmJs browser build ──────────────────────────────────────────
  sample-wasmjs:
    name: cmp-worker-sample-compose-store — wasmJs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build wasmJs distribution
        run: ./gradlew :samples:cmp-worker-sample-compose-store:wasmJsBrowserDistribution
