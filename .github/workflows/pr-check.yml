# PR Check Workflow — fast gate on pull requests
# Runs quality + JVM tests only (iOS/Linux skipped for speed).
# Full build runs on push to main/development via gradle.yml.

name: PR Check

on:
  pull_request:
    branches: [ "main", "development" ]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-check:
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/ci-kmp-library.yml@v1.6.1
    with:
      module-pattern: 'cmp-'
      java-version: '21'
      java-distribution: 'zulu'
      run-quality: true
      run-ios-tests: false
      run-linux-tests: false

  # worker-kmp-cmp-launchers-01: assert cmp-worker-compose publishes BCV
  # snapshots covering iosArm64 + iosSimulatorArm64 (+ js + wasmJs).
  ios-bcv-check:
    name: cmp-worker-compose iOS BCV snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert iOS BCV snapshot present + lists iOS targets
        run: bash scripts/check-ios-artifact.sh

  # worker-kmp-cmp-launchers-03: build the cmp-worker-sample-compose-store
  # sample for the Web (wasmJs browser) target.
  sample-wasmjs:
    name: cmp-worker-sample-compose-store — wasmJs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build wasmJs distribution
        run: ./gradlew :samples:cmp-worker-sample-compose-store:wasmJsBrowserDistribution

  # worker-kmp-cmp-launchers-03: build the iOS framework + xcodebuild the
  # iosApp wrapper. The .xcodeproj is generated from iosApp/project.yml via
  # xcodegen (see iosApp/README.md for the rationale).
  #
  # Compose Multiplatform 1.11.0's iOS framework auto-links iOS-18-only private
  # frameworks (UIUtilities, SwiftUICore) which require Xcode 26.x at link time.
  # GitHub Actions is migrating `macos-latest` from macOS 15 (Xcode 16.x) to
  # macOS 26 (Xcode 26.x) between June 15 → July 15, 2026:
  #   https://github.com/actions/runner-images
  #
  # Until that migration completes the job will linker-fail on macos-latest
  # because Xcode 26.x is not pre-installed on macOS 15 runners — so we mark
  # it `continue-on-error: true` for an informational run. Local validation
  # via Xcode 26.x is the source of truth in the meantime — see
  # `scripts/ci-local.sh --all` which does the same iOS sim build with the
  # local Xcode toolchain. Post July 15, 2026 this job will start passing
  # automatically without any workflow change.
  sample-ios:
    name: cmp-worker-sample-compose-store — iOS sim build (informational until 2026-07-15)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version (debug — pre-migration this is 16.x; post-migration 26.x)
        run: xcodebuild -version || true
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build iOS framework binaries
        run: ./gradlew :samples:cmp-worker-sample-compose-store:linkDebugFrameworkIosSimulatorArm64
      - name: Generate iosApp.xcodeproj
        working-directory: samples/cmp-worker-sample-compose-store/iosApp
        run: xcodegen generate
      - name: xcodebuild iosApp (iOS Simulator, arm64 only)
        run: |
          xcodebuild \
            -project samples/cmp-worker-sample-compose-store/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS= \
            build
