# Test Coverage Workflow — Kover gate.
# Per kover-100-coverage GOAL.md D10: lives in worker-kmp directly (not in the
# mbl-actionhub reusable workflow). Backport to mbl-actionhub v1.7.0 is a
# follow-up after the pattern proves out here.
# Per D11: koverVerify enforces minBound(100) per opted-in module — fails CI
# on regression.

name: Test Coverage

on:
  pull_request:
    branches: [ main, development ]
  push:
    branches: [ main, development ]

permissions:
  contents: read

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Kover 100% gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Kover (report + verify)
        run: ./gradlew koverHtmlReport koverXmlReport koverVerify --no-configuration-cache

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-html-report
          path: build/reports/kover/html/
          retention-days: 14

      - name: Surface coverage % in PR Step Summary
        if: always()
        run: |
          REPORT=build/reports/kover/report.xml
          if [ ! -f "$REPORT" ]; then
            echo "## ⚠ Coverage XML report missing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          COVERED=$(grep -m1 'type="LINE"' "$REPORT" | sed -E 's/.*covered="([0-9]+)".*/\1/')
          MISSED=$(grep -m1 'type="LINE"' "$REPORT" | sed -E 's/.*missed="([0-9]+)".*/\1/')
          TOTAL=$((COVERED + MISSED))
          if [ "$TOTAL" -eq 0 ]; then
            echo "## ⚠ No coverable lines reported" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          PCT=$((COVERED * 100 / TOTAL))
          echo "## ☂ Aggregate line coverage: ${PCT}% (${COVERED}/${TOTAL})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "HTML report uploaded as \`kover-html-report\` artifact." >> "$GITHUB_STEP_SUMMARY"
