# Publish Workflow — delegates to mbl-actionhub reusable publish workflow
#
# Triggers:
#   - Manual dispatch: workflow_dispatch (trigger from GitHub UI → Actions → Publish → Run workflow)
#
# Version is read from gradle.properties (worker.version).
# The workflow creates the GitHub release + tag automatically after publishing.
#
# Required secrets (org-level):
#   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD
#   SIGNING_KEY_ID, SIGNING_PASSWORD, GPG_KEY_CONTENTS

name: Publish

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Specific module to publish (leave empty for all cmp-* modules)'
        required: false
        type: string
      version:
        description: 'Override version (leave empty to use worker.version from gradle.properties)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    name: Publish cmp-* modules
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/publish-kmp-library.yml@v1.6.1
    with:
      module-pattern: 'cmp-'
      module: ${{ inputs.module || '' }}
      group-id: 'io.github.mobilebytelabs'
      artifact-id: 'worker-kmp'
      version: ${{ inputs.version || '' }}
      gradle-properties-key: 'worker.version'
      verify-against-maven: false
      bump-after-release: true
      java-version: '21'
      java-distribution: 'zulu'
      sonatype-host: 'CENTRAL_PORTAL'
      create-github-release: true
    secrets: inherit

  publish-worker-app-plugin:
    name: Publish worker-app-plugin
    # cmp-worker-app-plugin moved to build-logic/worker-app-plugin/ (kmp-product-flavors
    # pattern) so the convention plugin in build-logic can apply it as a sibling. It's
    # NOT discoverable by the cmp-* pattern job above — needs its own explicit job using
    # module-path. Reference: kmp-product-flavors uses the same pattern.
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/publish-kmp-library.yml@v1.6.1
    with:
      module-path: 'build-logic/worker-app-plugin'
      group-id: 'io.github.mobilebytelabs'
      artifact-id: 'worker-app-plugin'
      version: ${{ inputs.version || '' }}
      version-source: 'gradle-properties'
      gradle-properties-key: 'worker.version'
      verify-against-maven: false
      bump-after-release: false   # main job above already bumps once per run
      java-version: '21'
      java-distribution: 'zulu'
      sonatype-host: 'CENTRAL_PORTAL'
      create-github-release: false  # main job creates the release for the version
    secrets: inherit
