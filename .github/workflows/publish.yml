# Publish Workflow — delegates to mbl-actionhub reusable publish workflow
#
# Triggers:
#   - Manual dispatch: workflow_dispatch (trigger from GitHub UI → Actions → Publish → Run workflow)
#
# Version is read from gradle.properties (worker.version).
# The workflow creates the GitHub release + tag automatically after publishing.
#
# Required secrets (org-level):
#   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD
#   SIGNING_KEY_ID, SIGNING_PASSWORD, GPG_KEY_CONTENTS

name: Publish

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Specific module to publish (leave empty for all cmp-* modules)'
        required: false
        type: string
      version:
        description: 'Override version (leave empty to use worker.version from gradle.properties)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/publish-kmp-library.yml@v1.6.1
    with:
      module-pattern: 'cmp-'
      module: ${{ inputs.module || '' }}
      group-id: 'io.github.mobilebytelabs'
      artifact-id: 'worker-kmp'
      version: ${{ inputs.version || '' }}
      gradle-properties-key: 'worker.version'
      verify-against-maven: false
      bump-after-release: true
      java-version: '21'
      java-distribution: 'zulu'
      sonatype-host: 'CENTRAL_PORTAL'
      create-github-release: true
    secrets: inherit
