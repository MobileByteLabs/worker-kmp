# Tier-2 platform-engine tests — runs the per-platform test tasks excluded
# from the fast pr-check.yml gate. Required check on PR to development.
# Spec: plan-layer/project-plans/mbs/worker-kmp/active/worker-kmp-platform-engine-tests/GOAL.md

name: Platform Engine Tests (Tier-2)

on:
  pull_request:
    branches: [ "main", "development" ]
  push:
    branches: [ "development" ]

permissions:
  contents: read

concurrency:
  group: platform-engine-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: cmp-worker-android — testAndroidHostTest (Robolectric)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run testAndroidHostTest
        run: ./gradlew :cmp-worker-android:testAndroidHostTest --console=plain --no-daemon

  desktop:
    name: cmp-worker-desktop — jvmTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run jvmTest
        run: ./gradlew :cmp-worker-desktop:jvmTest --console=plain --no-daemon

  desktop-daemon:
    name: cmp-worker-desktop-daemon — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run test
        run: ./gradlew :cmp-worker-desktop-daemon:test --console=plain --no-daemon

  web:
    name: cmp-worker-web — jsNodeTest + wasmJsBrowserTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run jsNodeTest + wasmJsBrowserTest
        run: ./gradlew :cmp-worker-web:jsNodeTest :cmp-worker-web:wasmJsBrowserTest --console=plain --no-daemon

  web-push:
    name: cmp-worker-web-push — jsBrowserTest + wasmJsBrowserTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run jsBrowserTest + wasmJsBrowserTest
        run: ./gradlew :cmp-worker-web-push:jsBrowserTest :cmp-worker-web-push:wasmJsBrowserTest --console=plain --no-daemon

  ios:
    name: cmp-worker-ios — iosSimulatorArm64Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run iosSimulatorArm64Test
        run: ./gradlew :cmp-worker-ios:iosSimulatorArm64Test --console=plain --no-daemon
