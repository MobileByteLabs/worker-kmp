# CI Workflow — delegates to mbl-actionhub reusable CI workflow
#
# Triggers:
#   - push to main or development (full build)
#   - workflow_call (invoked by publish.yml before every Maven publish)
#
# PRs are handled separately by pr-check.yml (fast gate, no iOS/Linux).

name: CI

on:
  push:
    branches: [ "main", "development" ]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/ci-kmp-library.yml@v1.6.1
    with:
      module-pattern: 'cmp-'
      java-version: '21'
      java-distribution: 'zulu'
      run-quality: true

  coverage:
    name: Kover 100% gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Kover (report + verify)
        run: ./gradlew koverHtmlReport koverXmlReport koverVerify --no-configuration-cache
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-html-report
          path: build/reports/kover/html/
          retention-days: 14
