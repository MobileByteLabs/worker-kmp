name: Backward-Compat Test

on:
  pull_request:
    branches: [ development, main ]
  push:
    branches: [ development ]

permissions:
  contents: read

jobs:
  bc-test-diff:
    name: v2 baseline vs current v3 diff
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.pull_request.labels.*.name, 'skip-bc-test')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v3
      - name: Run BC test diff
        run: bash scripts/bc-test-diff.sh
      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bc-test-reports
          path: cmp-worker-bc-test/build/reports/junit/
